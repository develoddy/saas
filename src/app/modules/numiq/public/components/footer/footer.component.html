<footer class="raffle-footer">
  <div class="raffle-footer__content">
    <a
      class="raffle-footer__brand"
      routerLink="/numiq"
      [queryParams]="drawId !== null ? { drawId: drawId } : {}"
      aria-label="NUMIQ — Volver al inicio"
    >
      <img
        class="raffle-footer__logo"
        src="assets/brands/numiq/numiq-logo-horizontal.svg"
        alt=""
        width="220"
        height="55"
      >
    </a>

    <nav class="raffle-footer__nav" aria-label="Navegación del pie de página">
      <a
        routerLink="/numiq"
        [queryParams]="drawId !== null ? { drawId: drawId } : {}"
      >
        Inicio
      </a>

      <a
        routerLink="/numiq/winners"
        [queryParams]="drawId !== null ? { drawId: drawId } : {}"
      >
        Ganadores
      </a>
    </nav>

    <nav class="raffle-footer__legal" aria-label="Información legal">
      <a routerLink="/numiq/legal" [queryParams]="drawId !== null ? { drawId: drawId } : {}">Aviso legal</a>
      <a routerLink="/numiq/privacy" [queryParams]="drawId !== null ? { drawId: drawId } : {}">Privacidad</a>
      <a routerLink="/numiq/cookies" [queryParams]="drawId !== null ? { drawId: drawId } : {}">Cookies y almacenamiento</a>
      <a routerLink="/numiq/terms" [queryParams]="drawId !== null ? { drawId: drawId } : {}">Condiciones</a>
    </nav>

    <p class="raffle-footer__credits">
      Desarrollado por
      <a
        href="https://lujandev.com"
        target="_blank"
        rel="noopener noreferrer"
      >LujanDev</a>
      <span aria-hidden="true"> · </span>
      Un proyecto de Eddy Lujan
    </p>
  </div>
</footer>

<app-raffle-privacy-notice [drawId]="drawId"></app-raffle-privacy-notice>
