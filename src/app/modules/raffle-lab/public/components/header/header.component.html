<header class="raffle-header">
  <a
    class="raffle-brand"
    routerLink="/raffle-lab"
    [queryParams]="drawId !== null ? { drawId: drawId } : {}"
    aria-label="NUMIQ — Volver al inicio"
    (click)="closeMenu()"
  >
    <img
      class="numiq-logo"
      src="assets/brands/numiq/numiq-logo-horizontal.svg"
      alt="NUMIQ — Plataforma de gestión de sorteos"
      width="300"
      height="75"
    >
  </a>

  <button
    #menuToggle
    class="raffle-menu-toggle"
    type="button"
    [attr.aria-expanded]="menuOpen"
    aria-controls="raffle-header-menu"
    [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'"
    (click)="toggleMenu()"
  >
    <span class="raffle-menu-toggle__icon" aria-hidden="true">
      {{ menuOpen ? '×' : '☰' }}
    </span>
  </button>

  <div
    id="raffle-header-menu"
    class="raffle-header-actions"
    [class.is-open]="menuOpen"
  >
    <nav class="raffle-nav" aria-label="Navegación principal">
      <a routerLink="/raffle-lab" [queryParams]="drawId !== null ? { drawId: drawId } : {}" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" (click)="closeMenu()">Inicio</a>
      <a *ngIf="showNumbersLink" href="#numbers-title" (click)="scrollToNumbers($event)">Números</a>
      <a routerLink="/raffle-lab/winners" [queryParams]="drawId !== null ? { drawId: drawId } : {}" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" (click)="closeMenu()">Ganadores</a>
    </nav>


  </div>
</header>
