<header class="raffle-header">
  <div class="raffle-brand">
    <img
      class="numiq-logo"
      src="assets/brands/numiq/numiq-logo-horizontal.svg"
      alt="NUMIQ — Plataforma de gestión de sorteos"
      width="300"
      height="75"
    >
  </div>

  <button
    class="raffle-menu-toggle"
    type="button"
    [attr.aria-expanded]="menuOpen"
    aria-controls="raffle-header-menu"
    [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'"
    (click)="toggleMenu()"
  >
    <span class="raffle-menu-toggle__icon" aria-hidden="true">
      {{ menuOpen ? '×' : '☰' }}
    </span>
  </button>

  <div
    id="raffle-header-menu"
    class="raffle-header-actions"
    [class.is-open]="menuOpen"
  >
    <nav class="raffle-nav" aria-label="Navegación principal">
      <a routerLink="/raffle-lab" [queryParams]="drawId !== null ? { drawId: drawId } : {}" (click)="closeMenu()">Inicio</a>
      <a *ngIf="showNumbersLink" href="#numbers-title" (click)="scrollToNumbers($event)">Números</a>
      <a routerLink="/raffle-lab/winners" [queryParams]="drawId !== null ? { drawId: drawId } : {}" (click)="closeMenu()">Ganadores</a>
    </nav>

    <a class="raffle-management-link" routerLink="/raffle-lab/management" (click)="closeMenu()">
      Ir a gestión →
    </a>

  </div>
</header>
