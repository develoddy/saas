<footer class="raffle-footer">
  <div class="raffle-footer__content">
    <a
      class="raffle-footer__brand"
      routerLink="/raffle-lab"
      [queryParams]="drawId !== null ? { drawId: drawId } : {}"
      aria-label="NUMIQ — Volver al inicio"
    >
      <img
        class="raffle-footer__logo"
        src="assets/brands/numiq/numiq-logo-horizontal.svg"
        alt=""
        width="220"
        height="55"
      >
    </a>

    <nav class="raffle-footer__nav" aria-label="Navegación del pie de página">
      <a
        routerLink="/raffle-lab"
        [queryParams]="drawId !== null ? { drawId: drawId } : {}"
      >
        Inicio
      </a>

      <a
        routerLink="/raffle-lab/winners"
        [queryParams]="drawId !== null ? { drawId: drawId } : {}"
      >
        Ganadores
      </a>
    </nav>

    <nav class="raffle-footer__legal" aria-label="Información legal">
      <a routerLink="/raffle-lab/legal" [queryParams]="drawId !== null ? { drawId: drawId } : {}">Aviso legal</a>
      <a routerLink="/raffle-lab/privacy" [queryParams]="drawId !== null ? { drawId: drawId } : {}">Privacidad</a>
      <a routerLink="/raffle-lab/cookies" [queryParams]="drawId !== null ? { drawId: drawId } : {}">Cookies y almacenamiento</a>
      <a routerLink="/raffle-lab/terms" [queryParams]="drawId !== null ? { drawId: drawId } : {}">Condiciones</a>
    </nav>
  </div>
</footer>

<app-raffle-privacy-notice [drawId]="drawId"></app-raffle-privacy-notice>
